[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "euler-lagrange-neural-optimizer"
version = "0.1.0"
authors = [
  { name = "shu195", email = "barmase32@gmail.com" },
]
description = "Variational mechanics, symplectic integration, relativistic velocity-clamping, and non-layered spectral conditioning for neural network training."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]
